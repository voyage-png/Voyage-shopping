<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Voyage.com</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}header{background:#0a3d3d;color:white;padding:15px;display:flex;justify-content:space-between}.logo{font-weight:bold;font-size:22px}.logo span{color:#ffcc00}.search{text-align:center;padding:20px;background:#ffe8e8}.search input{padding:12px;width:85%;border-radius:25px;border:1px solid #ccc}.cat{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 12px 20px;white-space:nowrap}.cat button{padding:8px 15px;border-radius:20px;border:1px solid #0a3d3d;background:white;flex-shrink:0}.cat button.active{background:#0a3d3d;color:white}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}.card{background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #ddd}.card img{width:100%;height:180px;object-fit:cover;border-radius:10px}.buy{display:block;background:#0a3d3d;color:white;padding:8px;border-radius:20px;text-decoration:none;margin-top:6px;border:none;width:100%}.pr{font-weight:bold;color:#0a3d3d}.op{color:gray;text-decoration:line-through;font-size:13px}#orderModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:999;justify-content:center;align-items:center}#orderBox{background:white;width:90%;max-width:380px;border-radius:15px;padding:20px}.orderInput{width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #ccc}.orderBtn{width:100%;padding:12px;background:#25D366;color:white;border:none;border-radius:25px;font-weight:bold;margin-top:10px}</style></head><body style="overflow-x:hidden"><header><div class="logo">VOYAGE<span>.COM</span></div><div>🛒 Resell</div></header><div class="search"><h2>🔥 Diwali Sale - 60% OFF</h2><p style="font-size:13px;color:#0a3d3d">Direct Supplier Se - Free Delivery</p><br><input id="s" placeholder="Search..." onkeyup="render()"></div><div class="cat"><button class="active" onclick="setF('all',this)">All</button><button onclick="setF('ethnic',this)">Ethnic Wear</button><button onclick="setF('western',this)">Western</button><button onclick="setF('footwear',this)">Footwear</button><button onclick="setF('homedecor',this)">Home Decor</button><button onclick="setF('electronics',this)">Electronics</button></div><div class="grid" id="g"></div><div style="text-align:center;padding:20px;background:#0a3d3d;color:white"><p>✅ COD + UPI | Voyage © 2026</p></div><div id="orderModal"><div id="orderBox"><h3 style="text-align:center">📦 Order Details Bharo</h3><p id="pName" style="text-align:center;font-weight:bold;color:#0a3d3d;margin:8px 0"></p><input class="orderInput" id="cName" placeholder="Aapka Naam *"><input class="orderInput" id="cMobile" placeholder="Mobile Number *"><textarea class="orderInput" id="cAddr" placeholder="Pura Address *"></textarea><input class="orderInput" id="cPin" placeholder="Pincode *"><button class="orderBtn" onclick="confirmOrder()">✅ Confirm - WhatsApp + Pay</button><button class="orderBtn" style="background:#ddd;color:#333" onclick="closeModal()">Cancel</button></div></div><script>let f='all';let curProd=null;let P=[{c:"ethnic",n:"Red Banarasi Suit",p:799,op:1999,i:"https://images.unsplash.com/photo-1610035905869-d6e0a2d71c3f?w=500"},{c:"homedecor",n:"Beautiful Rose Candles (10 Pcs) 🕯️",p:149,op:299,i:"https://images.unsplash.com/photo-1603006905003-be475563bc59?w=500"},{c:"homedecor",n:"Rose Wax Candle Single",p:99,op:199,i:"https://images.unsplash.com/photo-1513519245088-0e12902e5a38?w=500"},{c:"western",n:"Stylish Dress",p:599,op:1299,i:"https://images.unsplash.com/photo-1515372039744-b8f02a3c67ae?w=500"}];function setF(v,b){f=v;document.querySelectorAll('.cat button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()}function render(){let q=document.getElementById('s').value.toLowerCase();let g=document.getElementById('g');g.innerHTML='';P.forEach((x,idx)=>{if((f=='all'||f==x.c)&&x.n.toLowerCase().includes(q)){g.innerHTML+=`<div class="card"><img src="${x.i}"><h4 style="margin:8px 0;font-size:14px">${x.n}</h4><div><span class="pr">₹${x.p}</span><span class="op">₹${x.op}</span></div><button class="buy" onclick="openOrder(${idx})">Buy Now</button></div>`}})}function openOrder(idx){curProd=P[idx];document.getElementById('pName').innerText=curProd.n+" - Rs "+curProd.p;document.getElementById('orderModal').style.display='flex'}function closeModal(){document.getElementById('orderModal').style.display='none'}function confirmOrder(){let name=document.getElementById('cName').value;let mob=document.getElementById('cMobile').value;let addr=document.getElementById('cAddr').value;let pin=document.getElementById('cPin').value;if(!name||!mob||!addr||!pin){alert("Sab details bharo!");return}let msg=`🔥 NEW ORDER Voyage.com%0AProduct: ${curProd.n}%0APrice: Rs ${curProd.p}%0ACustomer: ${name}%0AMobile: ${mob}%0AAddress: ${addr}%0APincode: ${pin}`;let waLink=`https://wa.me/916260501993?text=${msg}`;let upiLink=`upi://pay?pa=6260501993@ybl&pn=Voyage&am=${curProd.p}&cu=INR`;window.open(waLink,'_blank');setTimeout(()=>{window.location.href=upiLink},800);closeModal()}render();</script></body></html>
