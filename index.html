or:white"><p>💳 Secure UPI Payment</p><p style="font-size:12px">UPI: 6260501993@ybl | Voyage.com © 2026</p></div><script>let f='all';let p=[{n:"Red Banarasi Suit",pr:1899,c:"ethnic",i:"https://images.unsplash.com/photo-1610030469983-98e550d6193a"},{n:"Designer Lehenga",pr:2999,c:"ethnic",i:"https://images.unsplash.com/photo-1595777457583-95e059d581b8"},{n:"Blue Western Dress",pr:1299,c:"western",i:"https://images.unsplash.com/photo-1515372039744-b8f02a3ae442"},{n:"Golden Juttis",pr:899,c:"footwear",i:"https://images.unsplash.com/photo-1543163521-1bf539c55dd2"},{n:"Diya Set",pr:399,c:"homedecor",i:"https://images.unsplash.com/photo-1605600659873-d808009e2d8e"},{n:"Smart Watch",pr:1999,c:"electronics",i:"https://images.unsplash.com/photo-1523275335684-37898b6baf30"},{n:"Kitchen Storage Set",pr:499,c:"kitchen",i:"https://images.unsplash.com/photo-1584305574586-0a3737316f15"}];function setF(c,b){f=c;document.querySelectorAll('.cat button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();}function render(){let s=document.getElementById("s").value.toLowerCase();let h="";p.forEach(x=>{if((f=='all'||x.c==f)&&x.n.toLowerCase().includes(s)){h+=`<div class="card"><img src="${x.i}"><h4>${x.n}</h4><p>₹${x.pr}</p><a class="buy" href="upi://pay?pa=6260501993@ybl&pn=Voyage.com&am=${x.pr}&cu=INR&tn=${encodeURIComponent(x.n)}">Buy Now ₹${x.pr}</a></div>`;}});document.getElementById("g").innerHTML=h;}render();</script></body></html>
